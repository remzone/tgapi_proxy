services:
  tgproxy:
    build:
      context: .
      args:
        MTG_VERSION: v2.2.8
    image: tgproxy:local
    container_name: tgproxy
    restart: unless-stopped
    env_file: .env
    environment:
      TGPROXY_API_LISTEN: ":8080"
      TGPROXY_MTG_LISTEN: "0.0.0.0:443"
      TGPROXY_LOG_DIR: /var/log/tgproxy
    ports:
      - "${TGPROXY_MTG_PORT:-443}:443/tcp"
    expose:
      - "8080"
    volumes:
      - tgproxy_logs:/var/log/tgproxy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "7"

  api-http:
    image: caddy:2.10-alpine
    profiles: ["http"]
    restart: unless-stopped
    command: ["caddy", "reverse-proxy", "--from", ":8080", "--to", "tgproxy:8080"]
    depends_on:
      tgproxy:
        condition: service_healthy
    ports:
      - "${TGPROXY_API_PORT:-8443}:8080/tcp"
    security_opt:
      - no-new-privileges:true

  api-https:
    image: caddy:2.10-alpine
    profiles: ["https"]
    restart: unless-stopped
    command: ["caddy", "reverse-proxy", "--from", "${TGPROXY_PUBLIC_HOST:?set TGPROXY_PUBLIC_HOST}", "--to", "tgproxy:8080"]
    depends_on:
      tgproxy:
        condition: service_healthy
    ports:
      - "80:80/tcp"
      - "${TGPROXY_API_PORT:-443}:443/tcp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    security_opt:
      - no-new-privileges:true

volumes:
  tgproxy_logs:
  caddy_data:
  caddy_config:
